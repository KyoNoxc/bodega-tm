<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodega TM — Inventario</title>
<style>
  :root{
    --bg:#0E1B2C;
    --panel:#15263B;
    --panel-2:#1C3049;
    --line:#2C4560;
    --text:#EDF2F7;
    --text-dim:#A9BACB;
    --muted:#7C93A8;
    --amber:#F0A038;
    --amber-dim:#8A5A22;
    --cyan:#4FC3E8;
    --cyan-dim:#215B76;
    --red:#E3543F;
    --red-dim:#7A2E24;
    --radius:10px;
    --font-display: "Space Grotesk","Segoe UI",system-ui,sans-serif;
    --font-mono: "JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --font-body: -apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:44px;height:44px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand h1{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;letter-spacing:.2px;}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
  .header-actions{display:flex;gap:10px;}
  .btn{
    font-family:var(--font-body);font-size:14px;font-weight:600;
    padding:10px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;
    display:flex;align-items:center;gap:8px;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:#3A4049;background:var(--panel-2);}
  .btn-primary{background:var(--amber);border-color:var(--amber);color:#241505;}
  .btn-primary:hover{background:#E39A62;border-color:#E39A62;}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .search{
    flex:1;min-width:220px;position:relative;
  }
  .search input{
    width:100%;padding:10px 14px 10px 36px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-size:14px;font-family:var(--font-body);
  }
  .search input:focus{outline:none;border-color:var(--amber-dim);}
  .search input::placeholder{color:var(--muted);}
  .search::before{
    content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border:1.5px solid var(--muted);border-radius:50%;
  }
  .search::after{
    content:"";position:absolute;left:21px;top:63%;
    width:6px;height:1.5px;background:var(--muted);transform:rotate(45deg);
  }
  select{
    padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;font-family:var(--font-body);
  }

  .chips{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .chip{
    padding:7px 14px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-dim);font-size:13px;cursor:pointer;
    font-weight:500;
  }
  .chip.active{background:var(--amber-dim);border-color:var(--amber);color:#F5D9BE;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat .n{font-family:var(--font-display);font-size:22px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .15s, transform .1s;
  }
  .card:hover{border-color:#3A4049;}
  .card::before{
    content:"";position:absolute;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 16px 16px 0;border-color:transparent var(--bg) transparent transparent;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-id{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.5px;}
  .status-dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0;}
  .status-disponible{background:var(--cyan);}
  .status-uso{background:var(--amber);}
  .status-dañado{background:var(--red);}
  .card h3{font-size:15px;font-weight:600;margin:0 0 3px;line-height:1.3;}
  .card .cat{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .loc-tag{
    font-size:11.5px;font-family:var(--font-mono);color:var(--text-dim);
    background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:5px;
  }
  .qty{font-size:13px;font-weight:600;color:var(--text-dim);}
  .qty.low{color:var(--red);}

  /* Detail panel */
  .overlay{
    position:fixed;inset:0;background:rgba(8,10,13,.6);z-index:50;
    display:none;align-items:stretch;justify-content:flex-end;
  }
  .overlay.open{display:flex;}
  .panel{
    width:380px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);
    padding:22px;overflow-y:auto;
  }
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .panel-head h2{font-family:var(--font-display);font-size:18px;margin:0 0 4px;}
  .close-x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .field .val{font-size:14.5px;}
  .field select, .field input{
    width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:14px;font-family:var(--font-body);
  }
  .hist{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;}
  .hist h4{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px;}
  .hist-item{font-size:13px;color:var(--text-dim);padding:7px 0;border-bottom:1px dashed var(--line);}
  .hist-item:last-child{border-bottom:none;}
  .hist-item b{color:var(--text);font-weight:500;}

  .stock-box{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:14px;text-align:center;margin-bottom:16px;
  }
  .stock-num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--cyan);}
  .stock-num.low{color:var(--red);}
  .stock-label{font-size:12px;color:var(--muted);margin-top:2px;}
  .usage-box{
    background:var(--panel-2);border:1px solid var(--amber-dim);border-radius:8px;
    padding:14px;margin-bottom:16px;
  }
  .usage-box label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
  .usage-row{display:flex;gap:8px;}
  .usage-row input{
    width:80px;padding:9px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;font-family:var(--font-body);
  }
  .usage-row .btn{flex:1;justify-content:center;}
  .usage-box input#usageNote{
    width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:13.5px;font-family:var(--font-body);
  }

  /* Add modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,10,13,.6);z-index:60;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    width:420px;max-width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;
  }
  .modal h2{font-family:var(--font-display);font-size:17px;margin:0 0 16px;}
  .modal .field label{margin-bottom:5px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty p{font-size:14px;}

  footer{
    margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
    text-align:center;font-size:11.5px;color:var(--muted);
    letter-spacing:.4px;text-transform:uppercase;
  }

  @media(max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .header-actions .btn span{display:none;}
  }

  /* Login */
  .login-screen{
    position:fixed;inset:0;background:var(--bg);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .login-screen.open{display:flex;}
  .login-card{
    width:360px;max-width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:30px 26px;text-align:center;
  }
  .login-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:14px;}
  .login-card h1{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
  .login-card p{font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  .login-card .field{text-align:left;}
  .login-card .btn-primary{width:100%;justify-content:center;margin-top:6px;}
  .login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}

  .user-bar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  .user-bar button{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    font-size:12.5px;padding:6px 10px;border-radius:6px;cursor:pointer;
  }
  .user-bar button:hover{border-color:#3A4049;color:var(--text);}
</style>
</head>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// ⚠️ Pega aquí tu Project URL y anon public key (Supabase → Settings → API)
const SUPABASE_URL = 'https://oeywrigaieuxgjaialgt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7lPKqgZcMsQHMV3JnAt4hA_HXas2mIg';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let items = [];
let currentUser = null;
const cats = ['Todos','Herramienta','Material','Equipo','Consumible'];
let activeCat = 'Todos';

function statusLabel(s){
  return {disponible:'Disponible', uso:'En uso', dañado:'Dañado'}[s];
}

/* ---------- Autenticación ---------- */

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await onLogin(session); } else { showLogin(); }
}

function showLogin(){
  document.getElementById('loginScreen').classList.add('open');
  document.getElementById('appRoot').style.display='none';
}

async function onLogin(session){
  currentUser = session.user;
  document.getElementById('loginScreen').classList.remove('open');
  document.getElementById('appRoot').style.display='block';
  document.getElementById('userEmail').textContent = currentUser.email;
  await loadItems();
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Ingresa correo y contraseña.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = 'Correo o contraseña incorrectos.'; return; }
  await onLogin(data.session);
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser = null;
  items = [];
  showLogin();
}

/* ---------- Datos (Supabase) ---------- */

async function loadItems(){
  const { data, error } = await sb.from('items').select('*').order('created_at', { ascending:true });
  if(error){ console.error(error); alert('No se pudo cargar el inventario. Revisa la conexión.'); return; }
  items = data.map(d => ({ id:d.id, name:d.name, cat:d.category, loc:d.location, qty:d.qty, status:d.status }));
  render();
}

async function loadHistory(itemId){
  const { data, error } = await sb.from('movements').select('*').eq('item_id', itemId).order('created_at', { ascending:false });
  if(error){ return []; }
  return data;
}

async function logMovement(itemId, action){
  await sb.from('movements').insert({ item_id:itemId, action, by_user: currentUser?.email || 'desconocido' });
}

/* ---------- Render ---------- */

function renderChips(){
  const el = document.getElementById('catChips');
  el.innerHTML = cats.map(c =>
    `<div class="chip ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`
  ).join('');
}

function setCat(c){ activeCat = c; render(); }

function renderStats(){
  const el = document.getElementById('stats');
  const total = items.reduce((s,i)=>s+i.qty,0);
  const disponible = items.filter(i=>i.status==='disponible').length;
  const uso = items.filter(i=>i.status==='uso').length;
  const dañado = items.filter(i=>i.status==='dañado').length;
  el.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">piezas totales</div></div>
    <div class="stat"><div class="n">${disponible}</div><div class="l">disponibles</div></div>
    <div class="stat"><div class="n">${uso}</div><div class="l">en uso / servicio</div></div>
    <div class="stat"><div class="n">${dañado}</div><div class="l">dañados</div></div>
  `;
}

function render(){
  renderChips();
  renderStats();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const loc = document.getElementById('locFilter').value;
  const filtered = items.filter(i=>{
    const matchQ = i.name.toLowerCase().includes(q) || i.id.toLowerCase().includes(q);
    const matchCat = activeCat==='Todos' || i.cat===activeCat;
    const matchLoc = !loc || i.loc===loc;
    return matchQ && matchCat && matchLoc;
  });
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if(filtered.length===0){
    grid.innerHTML=''; empty.style.display='block';
  } else {
    empty.style.display='none';
    grid.innerHTML = filtered.map(i => `
      <div class="card" onclick="openDetail('${i.id}')">
        <div class="card-top">
          <span class="card-id">${i.id}</span>
          <span class="status-dot status-${i.status}"></span>
        </div>
        <h3>${i.name}</h3>
        <div class="cat">${i.cat}</div>
        <div class="card-foot">
          <span class="loc-tag">${i.loc}</span>
          <span class="qty ${(i.qty<=2 && (i.cat==='Material'||i.cat==='Consumible'))?'low':''}">${i.qty} pz</span>
        </div>
      </div>
    `).join('');
  }
}

async function openDetail(id){
  const i = items.find(x=>x.id===id);
  const hist = await loadHistory(id);
  const panel = document.getElementById('detailPanel');
  const esConsumible = (i.cat === 'Material' || i.cat === 'Consumible');

  const bloqueMovible = `
    <div class="field">
      <label>Estado</label>
      <select onchange="updateStatus('${i.id}', this.value)">
        <option value="disponible" ${i.status==='disponible'?'selected':''}>Disponible</option>
        <option value="uso" ${i.status==='uso'?'selected':''}>En uso</option>
        <option value="dañado" ${i.status==='dañado'?'selected':''}>Dañado</option>
      </select>
    </div>
    <div class="field">
      <label>Ubicación</label>
      <select onchange="updateLoc('${i.id}', this.value)">
        <option ${i.loc==='Bodega'?'selected':''}>Bodega</option>
        <option ${i.loc==='Camioneta 1'?'selected':''}>Camioneta 1</option>
        <option ${i.loc==='Camioneta 2'?'selected':''}>Camioneta 2</option>
        <option ${i.loc==='En servicio'?'selected':''}>En servicio</option>
      </select>
    </div>
    <div class="field">
      <label>Cantidad</label>
      <div class="val">${i.qty} piezas</div>
    </div>
  `;

  const bloqueConsumible = `
    <div class="field">
      <label>Ubicación</label>
      <div class="val">${i.loc}</div>
    </div>
    <div class="stock-box">
      <div class="stock-num ${i.qty<=2?'low':''}">${i.qty}</div>
      <div class="stock-label">piezas disponibles${i.qty<=2?' · quedan pocas':''}</div>
    </div>
    <div class="usage-box">
      <label>Registrar uso en servicio</label>
      <div class="usage-row">
        <input id="usageQty" type="number" min="1" max="${i.qty}" value="1">
        <button class="btn btn-primary" onclick="registerUsage('${i.id}')">Descontar</button>
      </div>
      <input id="usageNote" type="text" placeholder="Cliente o servicio (opcional)" style="margin-top:8px;">
    </div>
  `;

  panel.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${i.name}</h2>
        <span class="card-id">${i.id}</span>
      </div>
      <button class="close-x" onclick="closeDetail()">✕</button>
    </div>
    ${esConsumible ? bloqueConsumible : bloqueMovible}
    <div class="field">
      <label>Categoría</label>
      <div class="val">${i.cat}</div>
    </div>
    <div class="hist">
      <h4>Historial de movimientos</h4>
      ${hist.length ? hist.map(h=>`<div class="hist-item"><b>${h.action}</b><br>${h.by_user} · ${new Date(h.created_at).toLocaleDateString('es-MX')}</div>`).join('') : '<div class="hist-item">Sin movimientos registrados.</div>'}
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('open'); }

async function updateStatus(id, val){
  const i = items.find(x=>x.id===id);
  const { error } = await sb.from('items').update({ status: val }).eq('id', id);
  if(error){ alert('No se pudo actualizar. Intenta de nuevo.'); return; }
  await logMovement(id, `Estado cambiado a "${statusLabel(val)}"`);
  i.status = val;
  render();
}

async function updateLoc(id, val){
  const i = items.find(x=>x.id===id);
  const { error } = await sb.from('items').update({ location: val }).eq('id', id);
  if(error){ alert('No se pudo actualizar. Intenta de nuevo.'); return; }
  await logMovement(id, `Movido a "${val}"`);
  i.loc = val;
  render();
}

async function registerUsage(id){
  const i = items.find(x=>x.id===id);
  const qtyInput = document.getElementById('usageQty');
  const noteInput = document.getElementById('usageNote');
  const amount = parseInt(qtyInput.value);
  const note = noteInput.value.trim();

  if(!amount || amount < 1){ alert('Ingresa una cantidad válida.'); return; }
  if(amount > i.qty){ alert(`Solo hay ${i.qty} disponibles.`); return; }

  const newQty = i.qty - amount;
  const { error } = await sb.from('items').update({ qty: newQty }).eq('id', id);
  if(error){ alert('No se pudo registrar. Intenta de nuevo.'); return; }

  const detalle = note ? ` · ${note}` : '';
  await logMovement(id, `Se usaron ${amount} pza(s) en servicio${detalle}`);

  i.qty = newQty;
  render();
  await openDetail(id);
}

function openAddModal(){ document.getElementById('addOverlay').classList.add('open'); }
function closeAddModal(){ document.getElementById('addOverlay').classList.remove('open'); }

async function addItem(){
  const name = document.getElementById('newName').value.trim();
  if(!name){ return; }
  const cat = document.getElementById('newCat').value;
  const loc = document.getElementById('newLoc').value;
  const qty = parseInt(document.getElementById('newQty').value) || 1;
  const prefix = {Herramienta:'HR',Material:'MT',Equipo:'EQ',Consumible:'CS'}[cat];
  const num = String(items.filter(i=>i.cat===cat).length+1).padStart(3,'0');
  const id = `${prefix}-${num}`;

  const { error } = await sb.from('items').insert({ id, name, category:cat, location:loc, qty, status:'disponible' });
  if(error){ alert('No se pudo guardar. Intenta de nuevo.'); return; }
  await logMovement(id, 'Ítem agregado al inventario');

  document.getElementById('newName').value='';
  document.getElementById('newQty').value=1;
  closeAddModal();
  await loadItems();
}

checkSession();
</script>
</body>
